name: "Automated tests"
# Fake, fast stand-in used only on the sync-test/* branches of the end-to-end test: same name,
# pull_request paths-ignore and dispatch inputs as the real workflow. Fails when the tree has ci-fail.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "bigbluebutton-html5/public/locales/*.json"
  workflow_dispatch:
    inputs:
      jobs:
        type: choice
        options: [presentation-conversion, all]
        default: presentation-conversion
      bless:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - run: |
          if [ -n "$(git ls-tree --name-only HEAD ci-fail)" ]; then echo "fake failure"; exit 1; fi
          echo "fake tests passed ($EVENT)"
        env:
          EVENT: ${{ github.event_name }}
